data:
  score_target_column: score_bucket
  train_path: data/rulefollower_heuristic_ann_gpt41mini_reg_base/train.csv
  validation_path: data/rulefollower_heuristic_ann_gpt41mini_reg_base/validation.csv
  test_path: data/rulefollower_heuristic_ann_gpt41mini_reg_base/test.csv
loss:
  difficulty_weight: 0.0
  score_weight: 1.0
  soft_label_sigma: 1.0
model:
  dropout_prob: 0.1
  max_length: 256
  name: answerdotai/ModernBERT-base
  pooling_strategy: mean
  num_score_classes: 9
  label_offset: 1
optimizer:
  learning_rate: 2.0e-05
  warmup_ratio: 0.1
  weight_decay: 0.01
output:
  dir: outputs/rulefollower_heuristic_ann_gpt41mini_dist_base_sigma10
training:
  eval_batch_size: 16
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  num_epochs: 3
  seed: 42
  train_batch_size: 8
uncertainty:
  mc_dropout_passes: 10
